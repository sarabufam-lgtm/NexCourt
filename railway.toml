# ==============================================================================
# Railway.app Cloud Deployment Configuration
# ==============================================================================

[build]
builder = "nixpacks"
buildCommand = "npm run build:server"
watchPatterns = ["server/**"]

[deploy]
startCommand = "npm run start:server"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[variables]
NODE_ENV = "production"
PORT = "5000"
